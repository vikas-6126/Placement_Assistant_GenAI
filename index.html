<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="indigo" data-font-size="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement Assistant — Gen AI Internship</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>
<body>

<div class="app" id="app">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <div class="brand">
                <span class="brand-mark">P</span>
                <div class="brand-text">
                    <span class="brand-title">Placement Assistant</span>
                    <span class="brand-subtitle">Gen AI Internship</span>
                </div>
            </div>
            <button type="button" id="collapseBtn" class="icon-btn only-desktop" title="Collapse sidebar" aria-label="Collapse sidebar">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
            </button>
            <button type="button" id="sidebarClose" class="icon-btn only-mobile" aria-label="Close menu">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
            </button>
        </div>

        <button type="button" id="newChatBtn" class="new-chat-btn">
            <span class="plus">+</span> <span class="label-text">New chat</span>
        </button>

        <div class="sidebar-collapsible">

            <div class="sidebar-section">
                <label class="sidebar-label" for="companySelect">Company</label>
                <select id="companySelect">
                    <option value="">Select company</option>
                </select>
            </div>

            <div class="sidebar-section">
                <label class="sidebar-label" for="courseSelect">Course</label>
                <select id="courseSelect">
                    <option value="">Select course</option>
                </select>
            </div>

            <div class="sidebar-section">
                <span class="sidebar-label">Mode</span>
                <nav id="mode-buttons" class="mode-list">
                    <button type="button" class="mode-item active" data-mode="ask">Ask Question</button>
                    <button type="button" class="mode-item" data-mode="rolefit">Role Fit</button>
                    <button type="button" class="mode-item" data-mode="mock">Mock Test</button>
                    <button type="button" class="mode-item" data-mode="resume">Resume Review</button>
                    <button type="button" class="mode-item" data-mode="pdf">Preparation Plan</button>
                </nav>
            </div>

            <div class="sidebar-section history-section">
                <div class="history-search-wrap">
                    <svg viewBox="0 0 24 24" width="14" height="14" class="search-icon"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.5 19zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9"/></svg>
                    <input type="text" id="historySearch" placeholder="Search chats">
                </div>
                <div id="historyList" class="history-list"></div>
            </div>

        </div>

        <div class="sidebar-footer">
            <button type="button" id="settingsBtn" class="settings-btn">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19.14 12.94a7.5 7.5 0 0 0 .06-.94 7.5 7.5 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.3 7.3 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0 0 1.88L2.82 14.5a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.58-.23 1.13-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7"/></svg>
                <span class="label-text">Settings</span>
            </button>
            <div class="status-row">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText" class="label-text">Connecting…</span>
            </div>
        </div>

    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ===================== MAIN ===================== -->
    <main class="main">

        <header class="topbar">
            <button type="button" id="sidebarOpen" class="icon-btn only-mobile" aria-label="Open menu">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
            </button>
            <div class="topbar-title">
                <span id="modeTitle">Ask Question</span>
            </div>
            <button type="button" id="downloadBtn" class="topbar-action" title="Download last answer as PDF">
                Download PDF
            </button>
        </header>

        <section id="chatSection">
            <div id="chatBox"></div>
        </section>

        <section class="composer">

            <div id="fileChips" class="file-chips" hidden></div>

            <div class="composer-inner" id="composerInner">

                <div class="attach-wrap">
                    <button type="button" id="attachBtn" class="composer-icon-btn" title="Attach files" aria-haspopup="true" aria-expanded="false">
                        <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M11 5v6H5v2h6v6h2v-6h6v-2h-6V5z"/></svg>
                    </button>
                    <div id="attachMenu" class="attach-menu" hidden>
                        <button type="button" data-action="pdf">Upload PDF</button>
                        <button type="button" data-action="image">Upload Image</button>
                        <button type="button" data-action="resume">Upload Resume</button>
                        <button type="button" data-action="document">Upload Document</button>
                        <button type="button" data-action="multi">Upload Multiple Files</button>
                        <button type="button" data-action="camera">Camera</button>
                    </div>
                    <input type="file" id="pdfInput" accept=".pdf" hidden>
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    <input type="file" id="resumeInput" accept=".pdf,.docx,.doc" hidden>
                    <input type="file" id="documentInput" accept=".docx,.txt,.md,.markdown,.csv,.json" hidden>
                    <input type="file" id="multiInput" accept=".pdf,.docx,.txt,.md,.markdown,.csv,.json,image/*" multiple hidden>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
                </div>

                <textarea
                    id="userInput"
                    rows="1"
                    placeholder="Message Placement Assistant…"></textarea>

                <button type="button" id="stopBtn" class="stop-btn" aria-label="Stop generating" hidden>
                    <svg viewBox="0 0 24 24" width="14" height="14"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
                </button>

                <button type="button" id="sendBtn" class="send-btn" aria-label="Send message">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3.4 20.6 22 12 3.4 3.4l.01 6.6L17 12 3.41 14l-.01 6.6z"/></svg>
                </button>

            </div>

            <p class="composer-hint">Placement Assistant can make mistakes. Verify important placement details.</p>

        </section>

    </main>

</div>

<!-- ===================== SETTINGS PANEL ===================== -->
<div class="settings-overlay" id="settingsOverlay" hidden></div>
<div class="settings-panel" id="settingsPanel" hidden>
    <div class="settings-header">
        <h3>Settings</h3>
        <button type="button" id="settingsClose" class="icon-btn" aria-label="Close settings">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
        </button>
    </div>

    <div class="settings-body">

        <div class="settings-group">
            <span class="settings-label">Theme</span>
            <div class="segmented" id="themeToggle">
                <button type="button" data-value="light" class="active">Light</button>
                <button type="button" data-value="dark">Dark</button>
            </div>
        </div>

        <div class="settings-group">
            <span class="settings-label">Accent color</span>
            <div class="accent-swatches" id="accentSwatches">
                <button type="button" data-value="indigo" class="swatch active" style="--sw:#4f46e5"></button>
                <button type="button" data-value="emerald" class="swatch" style="--sw:#059669"></button>
                <button type="button" data-value="rose" class="swatch" style="--sw:#e11d48"></button>
                <button type="button" data-value="amber" class="swatch" style="--sw:#d97706"></button>
                <button type="button" data-value="slate" class="swatch" style="--sw:#111827"></button>
            </div>
        </div>

        <div class="settings-group">
            <span class="settings-label">Font size</span>
            <div class="segmented" id="fontSizeToggle">
                <button type="button" data-value="sm">Small</button>
                <button type="button" data-value="md" class="active">Medium</button>
                <button type="button" data-value="lg">Large</button>
            </div>
        </div>

        <div class="settings-group">
            <span class="settings-label">Chat data</span>
            <div class="settings-actions">
                <button type="button" id="exportChatsBtn" class="settings-action-btn">Export all chats</button>
                <label class="settings-action-btn" for="importChatsInput">Import chats</label>
                <input type="file" id="importChatsInput" accept="application/json" hidden>
                <button type="button" id="clearHistoryBtn" class="settings-action-btn danger">Clear all history</button>
            </div>
        </div>

    </div>
</div>

<div id="toastHost" class="toast-host"></div>

<!-- Marked.js for markdown rendering + highlight.js for code blocks -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
